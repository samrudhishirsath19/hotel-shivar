spring.application.name=hotel-shivar-backend
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Default profile: H2 file database (saved in the ./data folder, survives restarts).
# This lets the project run immediately in IntelliJ with zero setup.
# Switch to MySQL for real persistence - see application-mysql.properties
# and set: spring.profiles.active=mysql
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/hotelshivar;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Never run data.sql / schema.sql - tables are created by Hibernate, data comes from the API
spring.sql.init.mode=never
spring.jpa.open-in-view=false
