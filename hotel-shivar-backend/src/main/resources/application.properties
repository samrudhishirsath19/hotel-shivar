spring.application.name=hotel-shivar-backend
server.port=${PORT:8080}

# Default database: MySQL
spring.datasource.url=JDBC:mysql://localhost:3306/hotel_shivar?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never
spring.jpa.open-in-view=false

# H2 console disabled when using MySQL
spring.h2.console.enabled=false

app.auth.jwt-secret=${JWT_SECRET:hotel-shivar-dev-secret-change-me-before-going-live-1234567890}
app.auth.token-hours=8
app.admin.email=${ADMIN_EMAIL:admin@hotelshivar.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=Super Admin

# Customer OTP login: no SMS provider is set up yet, so the OTP is shown on screen (demo).
# Set OTP_SHOW_CODE=false once real SMS sending is added (see SmsSender).
app.otp.show-code=${OTP_SHOW_CODE:true}

# ---- Razorpay (online payment) ----
# Put your keys in hotel-shivar-backend/secrets.properties (not committed - see secrets.properties.example)
# or in the environment variables RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET.
# Without keys the demo payment page is used.
spring.config.import=optional:file:./secrets.properties,optional:file:./hotel-shivar-backend/secrets.properties
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ---- Email (SMTP) ----
# Gmail for development: MAIL_USERNAME = the Gmail address, MAIL_PASSWORD = a 16-character Google *App Password*
# (Google account > Security > 2-Step Verification > App passwords), not the normal Gmail password.
# Credentials come ONLY from the environment variables. Without MAIL_USERNAME emails are written to the log instead.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=devlopement.omkar@gmail.com
spring.mail.password=bmtyclixobluwstc
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Sender shown to guests (defaults to the SMTP account)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:devlopement.omkar@gmail.com}}
app.mail.hotel-name=Hotel Shivar
# Website address used in email links (password reset, booking / order tracking)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Forgot password: OTP valid 10 minutes, 5 wrong tries; reset link valid 30 minutes
app.password-reset.otp-minutes=10
app.password-reset.link-minutes=30
app.password-reset.max-attempts=5
# Thymeleaf is only used for email templates (no server-side web pages)
spring.thymeleaf.check-template-location=false

# ---- Delivery ----
# Time (seconds) a delivery boy has to accept an order sent to him; after that it goes back for reassignment.
app.delivery.accept-seconds=${DELIVERY_ACCEPT_SECONDS:120}
