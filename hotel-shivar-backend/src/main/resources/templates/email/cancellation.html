<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout('Cancellation confirmation', ~{::#content})}" lang="en">
<body>
<div id="content">
    <h1 style="margin:0 0 8px;font-size:22px;color:#1F3B2D;"><span th:text="${c.kind}">Booking</span> cancelled</h1>
    <p style="margin:0 0 18px;">Hi <span th:text="${c.name}">Guest</span>, your <span th:text="${#strings.toLowerCase(c.kind)}">booking</span>
        <b>#<span th:text="${c.id}">1</span></b> was cancelled on <span th:text="${fmt.dateTime(c.cancelledAt)}">date</span>.</p>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e5e7eb;border-radius:8px;font-size:14px;"
           th:if="${c.refundAmount != null}">
        <tr><td colspan="2" style="padding:10px 14px;font-weight:bold;background:#f4f1ea;">Refund</td></tr>
        <tr><td style="padding:10px 14px;color:#6b7280;border-bottom:1px solid #f1f1f1;">Amount</td>
            <td style="padding:10px 14px;text-align:right;font-weight:bold;color:#1F3B2D;border-bottom:1px solid #f1f1f1;" th:text="${fmt.money(c.refundAmount)}">0</td></tr>
        <tr th:if="${c.refundId}"><td style="padding:10px 14px;color:#6b7280;border-bottom:1px solid #f1f1f1;">Refund ID</td>
            <td style="padding:10px 14px;text-align:right;font-family:'Courier New',monospace;border-bottom:1px solid #f1f1f1;" th:text="${c.refundId}">rfnd_x</td></tr>
        <tr th:if="${c.refundMethod}"><td style="padding:10px 14px;color:#6b7280;border-bottom:1px solid #f1f1f1;">Refunded to</td>
            <td style="padding:10px 14px;text-align:right;border-bottom:1px solid #f1f1f1;" th:text="${c.refundMethod}">UPI</td></tr>
        <tr th:if="${c.refundNote}"><td colspan="2" style="padding:10px 14px;font-size:13px;color:#374151;" th:text="${c.refundNote}">note</td></tr>
    </table>
    <p style="margin:0;padding:12px;background:#f9fafb;border-radius:8px;font-size:14px;" th:if="${c.refundAmount == null}">
        No payment was taken, so there is nothing to refund.
    </p>

    <p style="margin:18px 0 0;font-size:13px;color:#6b7280;">
        If you did not ask for this cancellation, please contact the hotel. We hope to welcome you again soon.
    </p>
</div>
</body>
</html>
