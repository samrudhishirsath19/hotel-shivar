<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout('Payment receipt', ~{::#content})}" lang="en">
<body>
<div id="content">
    <h1 style="margin:0 0 8px;font-size:22px;color:#1F3B2D;">Payment received</h1>
    <p style="margin:0 0 18px;">Hi <span th:text="${r.customerName}">Guest</span>, here is the receipt for your payment for order <b>#<span th:text="${r.orderId}">1</span></b>.</p>

    <div style="text-align:center;margin:0 0 18px;">
        <div style="font-size:13px;color:#6b7280;">Amount paid</div>
        <div style="font-size:30px;font-weight:bold;color:#1F3B2D;" th:text="${fmt.money(r.amount)}">0</div>
        <span style="display:inline-block;margin-top:6px;background:#dcfce7;color:#166534;font-size:12px;font-weight:bold;padding:4px 12px;border-radius:999px;" th:text="${r.status}">SUCCESS</span>
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e5e7eb;border-radius:8px;font-size:14px;">
        <tr><td style="padding:10px 14px;color:#6b7280;border-bottom:1px solid #f1f1f1;">Transaction ID</td>
            <td style="padding:10px 14px;text-align:right;font-family:'Courier New',monospace;border-bottom:1px solid #f1f1f1;" th:text="${r.transactionId}">pay_x</td></tr>
        <tr th:if="${r.reference}"><td style="padding:10px 14px;color:#6b7280;border-bottom:1px solid #f1f1f1;">Reference</td>
            <td style="padding:10px 14px;text-align:right;font-family:'Courier New',monospace;border-bottom:1px solid #f1f1f1;" th:text="${r.reference}">ref</td></tr>
        <tr><td style="padding:10px 14px;color:#6b7280;border-bottom:1px solid #f1f1f1;">Date</td>
            <td style="padding:10px 14px;text-align:right;border-bottom:1px solid #f1f1f1;" th:text="${fmt.dateTime(r.paidAt)}">date</td></tr>
        <tr><td style="padding:10px 14px;color:#6b7280;border-bottom:1px solid #f1f1f1;">Method</td>
            <td style="padding:10px 14px;text-align:right;border-bottom:1px solid #f1f1f1;" th:text="${r.method}">UPI</td></tr>
        <tr><td style="padding:10px 14px;color:#6b7280;">Status</td>
            <td style="padding:10px 14px;text-align:right;font-weight:bold;color:#166534;" th:text="${r.status}">SUCCESS</td></tr>
    </table>

    <p style="margin:18px 0 0;" th:if="${r.trackingLink}">
        <a th:href="${r.trackingLink}" href="#" style="color:#B8893C;font-weight:bold;">View the order and payment history</a>
    </p>
    <p style="margin:12px 0 0;font-size:12px;color:#6b7280;">Keep this email as your payment receipt.</p>
</div>
</body>
</html>
