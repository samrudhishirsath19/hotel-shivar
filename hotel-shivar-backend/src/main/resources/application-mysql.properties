# ---------------------------------------------------------------------------
# MySQL profile. Activate with: spring.profiles.active=mysql
# (in application.properties, an env var, or an IntelliJ run configuration)
# Create the database first:  CREATE DATABASE hotel_shivar;
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_shivar?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

