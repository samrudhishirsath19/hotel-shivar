# Loaded by AuthWebConfig (@PropertySource). Your own application.properties / application-mysql.properties
# (database name, user, password) are NOT touched. Anything you set there overrides the values below.

# ---- Login ----
# Secret used to sign login tokens. MUST be 32+ characters. Set JWT_SECRET in production.
app.auth.jwt-secret=${JWT_SECRET:hotel-shivar-dev-secret-change-me-before-going-live-1234567890}
# How long a login stays valid (hours)
app.auth.token-hours=8

# ---- First super admin (created on first start if this email does not exist) ----
# CHANGE the password, or set ADMIN_EMAIL / ADMIN_PASSWORD environment variables.
app.admin.email=${ADMIN_EMAIL:admin@hotelshivar.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=Super Admin

# ---- Restaurant ----
# Number of tables shown on the Restaurant page and in the manager dashboard
app.restaurant.table-count=5
