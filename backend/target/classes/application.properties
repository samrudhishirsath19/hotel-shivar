# Load local secrets from backend/.env (see .env.example). Real env vars take precedence.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/hotel_shivar?createDatabaseIfNotExist=true}
spring.datasource.username=root 
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Admin API key (required for GET/PATCH/DELETE on /api/contact) ---
app.admin.api-key=${ADMIN_API_KEY:}

# --- Mail ---
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:stay@hotelshivar.com}
app.mail.admin-to=${MAIL_ADMIN_TO:stay@hotelshivar.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
